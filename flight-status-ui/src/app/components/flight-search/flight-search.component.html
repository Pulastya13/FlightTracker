<div class="search-container">
  <h1>✈ Flight Status Tracker</h1>
  <p class="subtitle">SkyRoute Support Portal</p>

  <form (ngSubmit)="search()" class="search-form">
    <div class="form-group">
      <label for="flightNumber">Flight Number</label>
      <input
        id="flightNumber"
        type="text"
        [(ngModel)]="flightNumber"
        name="flightNumber"
        placeholder="e.g. SK1234"
        autocomplete="off"
      />
    </div>

    <div class="form-group">
      <label for="date">Date</label>
      <input
        id="date"
        type="date"
        [(ngModel)]="date"
        name="date"
      />
    </div>

    <button type="submit" [disabled]="loading">
      Search
    </button>
  </form>

  <div *ngIf="loading" class="loading-indicator">
    <span class="spinner"></span> Looking up flight status...
  </div>

  <div *ngIf="error" class="error-message">
    <span class="error-icon">⚠</span> {{ error }}
  </div>

  <app-flight-result *ngIf="result" [result]="result"></app-flight-result>
</div>
